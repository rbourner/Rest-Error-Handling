
# Persistence
kogito.persistence.type=jdbc
kie.flyway.enabled=true
spring.flyway.enabled=false

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:kogito;NON_KEYWORDS=VALUE,KEY
spring.datasource.username=kogito
spring.datasource.password=kogito

spring.datasource.hikari.maximum-pool-size=20

spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none


# Security
kogito.auth.enabled=false

# Business service
kogito.service.url=http://0.0.0.0:8080
kogito.jobs-service.url=http://0.0.0.0:8080
kogito.dataindex.http.url=http://0.0.0.0:8080

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.always-include=true

# Logging
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.persister.entity=DEBUG
logging.level.org.hibernate.mapping=DEBUG
